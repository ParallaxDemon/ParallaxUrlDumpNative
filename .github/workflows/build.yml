name: build native suite + liburldump.so

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-suite:
    name: Host C++ suite (CMake + ctest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libcapstone-dev

      - name: Configure
        run: cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI and tests
        run: cmake --build build-host -j2

      - name: Run native tests
        run: ctest --test-dir build-host --output-on-failure

      - name: CLI smoke test
        run: ./build-host/parallax_dump --help

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: parallax-dump-host
          path: build-host/parallax_dump

  android-ndk:
    name: Android liburldump.so (4 ABIs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r25c
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> "$GITHUB_ENV"

      - name: Build all ABIs
        run: |
          "$ANDROID_NDK_HOME/ndk-build" -C app/src/main/jni
          file app/src/main/libs/*/liburldump.so

      - name: Package
        run: |
          mkdir -p artifacts
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "artifacts/$abi"
            cp "app/src/main/libs/$abi/liburldump.so" "artifacts/$abi/"
          done
          (cd artifacts && zip -r ../liburldump-all.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liburldump-all
          path: |
            liburldump-all.zip
            artifacts/**

      - name: Attach ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: liburldump-all.zip
